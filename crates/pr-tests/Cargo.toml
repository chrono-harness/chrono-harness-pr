[package]
name = "chrono-pr-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-test-process = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "5c9364711a47ab45242195f11ca350e5d2b858cf" }
chrono-pr = { path = "../pr" }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "5c9364711a47ab45242195f11ca350e5d2b858cf" }
serde_json = "1"

[dev-dependencies]
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
tempfile = "3"
libc = "0.2"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "verified_snapshot"
path = "tests/verified_snapshot.rs"

[[bin]]
name = "chrono-pr-test-cli"
path = "../pr/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-pr-test-gh"
path = "tests/support/gh.rs"
test = false
bench = false

# 与真实 runner 的开发配置一致；保留调试断言及原行为时限。
[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
