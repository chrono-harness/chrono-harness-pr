[package]
name = "chrono-pr"
version = "0.1.0"
edition = "2024"
publish = false
description = "Head-bound pull request operations for AI callers"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-pr"
path = "src/main.rs"
test = false
bench = false

[dependencies]
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "5c9364711a47ab45242195f11ca350e5d2b858cf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
