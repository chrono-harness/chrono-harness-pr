[package]
name = "chrono-pr"
version = "0.1.2"
edition = "2024"
publish = false
description = "Head-bound pull request operations for AI callers"

[features]
test-gh = []

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "chrono-pr-test-gh"
path = "tests/support/gh.rs"
required-features = ["test-gh"]
test = false
bench = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-pr"
path = "src/main.rs"
test = false
bench = false

[dependencies]
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
subprocess = "1.2.3"
libc = "0.2"
which = "8"
json-syntax = "0.12.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
