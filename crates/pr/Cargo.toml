[package]
name = "chrono-pr"
version = "0.1.21"
edition = "2024"
publish = false
description = "Head-bound pull request operations for AI callers"

[features]
test-gh = []

[dev-dependencies]
sha2 = "0.11"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tempfile = "3"

[[bin]]
name = "chrono-pr-test-gh"
path = "tests/support/gh.rs"
required-features = ["test-gh"]
test = false
bench = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-pr"
path = "src/main.rs"
test = false
bench = false

[dependencies]
verus_builtin_macros = "=0.0.0-2026-11-22-0344"
subprocess = "1.2.3"
libc = "0.2"
which = "8"
json-syntax = "0.13.1"
rusqlite = { version = "0.43", features = ["bundled", "functions", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
