name: Observe landing event
run-name: Observe ${{ github.event.workflow_run.path }} attempt ${{ github.event.workflow_run.id }}/${{ github.event.workflow_run.run_attempt }}
on:
  workflow_run:
    branches: [dev]
    workflows: [CodeQL, Push on dev, check]
    types: [completed]
permissions: {}
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record the upstream GitHub run and its commit
        run: |
          jq '{action, workflow: (.workflow | {id, name, path}), workflow_run: (.workflow_run | {id, run_attempt, path, event, head_branch, head_sha, conclusion, repository: .repository.full_name})}' "$GITHUB_EVENT_PATH"
