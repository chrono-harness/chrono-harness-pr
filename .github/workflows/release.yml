name: Release
on:
  workflow_run:
    workflows: ["check"]
    types: [completed]
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      preview: ${{ steps.plan.outputs.preview }}
      proof: ${{ steps.plan.outputs.proof }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the release verifier
        shell: bash
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/release-tool.XXXXXXXX")
          curl --fail --silent --show-error --location "https://github.com/chrono-harness/chrono-harness-host-release/releases/download/v0.1.0-alpha.30/chrono-host-release-linux-x86_64" -o "$directory/chrono-host-release"
          (cd "$directory" && echo "9ad5c65299b7cddbe467bf1319a38f7cb905e342f916ea247e67380051150a05  chrono-host-release" | sha256sum --check --status)
          chmod 755 "$directory/chrono-host-release"
          echo "$directory" >> "$GITHUB_PATH"

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release/plan.py
  build:
    needs: source
    if: needs.source.outputs.mode == 'preview'
    name: Build ${{ matrix.platform }}
    outputs:
      linux: ${{ steps.producer.outputs.linux }}
      macos: ${{ steps.producer.outputs.macos }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: macos-aarch64
            output: macos
          - runner: ubuntu-24.04
            platform: linux-x86_64
            output: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/dev
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the already checked commit from this repository's development branch
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Build and exercise the release binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/dist"
          build=$(jq -er .build .chrono-harness/release.json)
          "./$build" "$PLATFORM" "$RUNNER_TEMP/dist"
      - name: Upload the exercised binary
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}-${{ needs.source.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1
      - name: Record the producing attempt and file digest
        id: producer
        env:
          PLATFORM: ${{ matrix.platform }}
          OUTPUT_KEY: ${{ matrix.output }}
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
          ARCHIVE_SHA: ${{ steps.archive.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          binary=$(jq -er .binary .chrono-harness/release.json)
          digest=$(shasum -a 256 "$RUNNER_TEMP/dist/$binary-$PLATFORM" | cut -d ' ' -f 1)
          receipt=$(jq -cn --arg id "$ARTIFACT_ID" --arg archive "$ARCHIVE_SHA" --arg file "$digest" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{id:$id,archive:$archive,file:$file,run:$run,attempt:$attempt}')
          echo "$OUTPUT_KEY=$receipt" >> "$GITHUB_OUTPUT"
  publish:
    needs: [source, build]
    if: >-
      always() && needs.source.result == 'success' && needs.source.outputs.mode != 'complete' &&
      (needs.build.result == 'success' || (needs.source.outputs.mode == 'stable' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-${{ needs.source.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - if: needs.source.outputs.mode == 'preview'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/dist
          artifact-ids: ${{ fromJSON(needs.build.outputs.linux).id }},${{ fromJSON(needs.build.outputs.macos).id }}
          merge-multiple: true
      - name: Install the release verifier
        shell: bash
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/release-tool.XXXXXXXX")
          curl --fail --silent --show-error --location "https://github.com/chrono-harness/chrono-harness-host-release/releases/download/v0.1.0-alpha.30/chrono-host-release-linux-x86_64" -o "$directory/chrono-host-release"
          (cd "$directory" && echo "9ad5c65299b7cddbe467bf1319a38f7cb905e342f916ea247e67380051150a05  chrono-host-release" | sha256sum --check --status)
          chmod 755 "$directory/chrono-host-release"
          echo "$directory" >> "$GITHUB_PATH"

      - name: Verify and publish the selected release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.source.outputs.mode }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          TAG: ${{ needs.source.outputs.tag }}
          PREVIEW: ${{ needs.source.outputs.preview }}
          PROOF: ${{ needs.source.outputs.proof }}
          BUILD_RECEIPTS: ${{ toJSON(needs.build.outputs) }}
          DIST: ${{ runner.temp }}/dist
        run: python3 .github/release/publish.py
